name: Security
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * 1" }]   # weekly, so newly disclosed vulnerabilities are caught without a code change
permissions: { contents: read }
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fail on high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy: { matrix: { app: [api, web] } }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t bank-case-${{ matrix.app }}:scan .
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "bank-case-${{ matrix.app }}:scan", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - uses: anchore/sbom-action@v0
        with: { image: "bank-case-${{ matrix.app }}:scan", artifact-name: "sbom-${{ matrix.app }}.spdx.json" }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
