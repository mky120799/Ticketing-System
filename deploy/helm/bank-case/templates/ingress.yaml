{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bank-case.fullname" . }}
  labels: {{- include "bank-case.labels" . | nindent 4 }}
  annotations:
    # SSE streams are long-lived: do not buffer or time them out at the proxy.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ include "bank-case.fullname" . }}-api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ include "bank-case.fullname" . }}-web, port: { name: http } } } }
{{- end }}
