{{- $ctx := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bank-case.fullname" . }}-api
  labels: {{- include "bank-case.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: {{- include "bank-case.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bank-case.selector" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "bank-case.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "bank-case.podSecurity" (dict "user" 1000) | nindent 6 }}
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "bank-case.selector" $ctx | nindent 14 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "bank-case.image" (dict "root" . "image" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env: {{- include "bank-case.apiEnv" . | nindent 12 }}
          readinessProbe: { httpGet: { path: /v1/health/ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /v1/health/live, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /v1/health/live, port: http }, periodSeconds: 3, failureThreshold: 30 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "bank-case.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bank-case.fullname" . }}-api
  labels: {{- include "bank-case.labels" . | nindent 4 }}
spec:
  selector: {{- include "bank-case.selector" $ctx | nindent 4 }}
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bank-case.fullname" . }}-api
  labels: {{- include "bank-case.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "bank-case.fullname" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} } } }]
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bank-case.fullname" . }}-api
  labels: {{- include "bank-case.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "bank-case.selector" $ctx | nindent 6 }}
{{- end }}
